map "$status:$arg_v" $static_asset_cache {
    default "no-store";
    "~^(200|206|304):[a-f0-9]{16}$" "public, max-age=31536000, immutable";
    ~^(200|206|304): "no-cache";
}

map $status $bundle_cache {
    default "no-store";
    200 "public, max-age=31536000, immutable";
    206 "public, max-age=31536000, immutable";
    304 "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    gzip_static on;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"healthy","app":"House Web MCP furnished branch","revision":"__REVISION__"}';
    }
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location = /webmcp-tools.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        add_header Cache-Control $bundle_cache always;
        try_files $uri =404;
    }
    location ^~ /models/ {
        add_header Cache-Control $static_asset_cache always;
        try_files $uri =404;
    }
    location ^~ /textures/ {
        add_header Cache-Control $static_asset_cache always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
